[package]
name = "tuxrgb"
description = "TuxRGB – RGB lighting control for Linux, native Wayland, Material 3 Expressive, powered by OpenRGB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "../../README.md"

[[bin]]
name = "tuxrgb"
path = "src/main.rs"

[dependencies]
tuxrgb-core.workspace = true
tuxrgb-openrgb.workspace = true
tuxrgb-capture.workspace = true
iced.workspace = true
material-colors.workspace = true
tokio.workspace = true
crossbeam-channel.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
directories.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
ureq.workspace = true
sha2.workspace = true
semver.workspace = true
# Hardware displays (3.1): screens drawn in software, user pictures and the
# JPEG stream of the Corsair LCD screens.
tiny-skia = "0.11"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Windows: OpenRGB 1.1 is fetched by tuxrgb.exe itself at install time
# (`--fetch-openrgb`), no PowerShell script in the installer.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Linux (reference platform): tray, portals, D-Bus, desktop files.
[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true
ashpd.workspace = true
zbus.workspace = true
libc.workspace = true
rust-ini.workspace = true
# Screens on / off (KWin DPMS, ext-idle-notify): LEDs off with the screens.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

# Windows build: Win32 tray, power events, registry, single instance.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Foundation",
    "UI_ViewManagement",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Shutdown",
    "Win32_UI_Controls_Dialogs",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
